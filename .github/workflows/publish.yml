name: publish

# Pushing a tag like v0.1.0 builds the package and uploads it to PyPI. No token is stored anywhere:
# PyPI trusts this workflow directly (a "trusted publisher" set up on pypi.org).
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
