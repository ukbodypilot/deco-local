[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deco-local"
version = "1.0.0"
description = "Local control of TP-Link Deco mesh routers (no cloud, no app): Python library, CLI and MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3",
    "cryptography>=42",
    "mcp>=2.3,<3",
]
keywords = ["tp-link", "deco", "mesh", "router", "mcp", "claude", "home-network"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/ukbodypilot/deco-local"

[project.scripts]
deco = "deco_local.cli:main"
deco-mcp = "deco_local.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["deco_local"]
